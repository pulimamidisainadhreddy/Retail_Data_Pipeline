services:

  postgres:
    image: postgres:16
    container_name: retail_postgres

    environment:
      POSTGRES_DB: retail_data_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .

    depends_on:
      - postgres

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data:  